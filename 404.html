<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Страница не найдена — перенаправление…</title>
    <meta name="robots" content="noindex">
    <script>
        (function () {
            const pathSegments = window.location.pathname.split('/').filter(Boolean);
            let basePath = '/';
            if (pathSegments.length > 0 && window.location.hostname.endsWith('github.io')) {
                basePath = '/' + pathSegments[0] + '/';
            }
            const redirectUrl = window.location.origin + basePath + 'index.html';
            window.location.replace(redirectUrl);
        })();
    </script>
    <noscript>
        <meta http-equiv="refresh" content="0; url=/index.html">
    </noscript>
</head>
<body>
    <p>Перенаправление на <a href="/index.html">главную страницу</a>…</p>
</body>
</html>
